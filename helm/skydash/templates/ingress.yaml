apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skydash-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:

          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000

          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 5001

          - path: /api/restaurant
            pathType: Prefix
            backend:
              service:
                name: restaurant-service
                port:
                  number: 5002

          - path: /api/superadmin
            pathType: Prefix
            backend:
              service:
                name: restaurant-service
                port:
                  number: 5002

          - path: /api/food-items
            pathType: Prefix
            backend:
              service:
                name: restaurant-service
                port:
                  number: 5002

          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 5005

          - path: /api/users
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 5005

          - path: /api/payment
            pathType: Prefix
            backend:
              service:
                name: payment-service
                port:
                  number: 5004